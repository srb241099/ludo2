<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Ludo Royale</title>
<meta name="theme-color" content="#15112e">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--r:#ef476f;--g:#06c28b;--y:#ffc233;--b:#3a86ff;--gold:#ffcb47;--ink:#15112e;--s:min(94vw,56dvh,560px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:radial-gradient(120% 80% at 50% 0,#3a2a7a 0,#15112e 60%) #15112e;color:#fff;font-family:'Baloo 2',system-ui,sans-serif}
button{font:inherit;color:inherit;border:0;cursor:pointer}
section{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom)}
.hide{display:none!important}
/* menu */
#menu{justify-content:center;gap:14px}
h1{margin:0;font-size:clamp(56px,18vw,96px);font-weight:800;letter-spacing:4px;line-height:1;color:#fff;text-shadow:0 2px 0 #ef476f,0 4px 0 #ffc233,0 6px 0 #06c28b,0 8px 0 #3a86ff,0 18px 24px #0008}
.sub{opacity:.75;margin:0 0 6px;font-size:17px}
.pawns{display:flex;gap:10px;height:70px;align-items:flex-end;margin-bottom:6px}
.pawns .pawn{position:relative;width:38px;height:62px;left:0;bottom:0;transform:none;animation:bob 1.6s ease-in-out infinite}
.pawns .pawn:nth-child(2){animation-delay:.2s}.pawns .pawn:nth-child(3){animation-delay:.4s}.pawns .pawn:nth-child(4){animation-delay:.6s}
@keyframes bob{50%{transform:translateY(-14px)}}
.mode{width:min(360px,100%);display:flex;align-items:center;gap:14px;padding:14px 18px;border-radius:20px;background:linear-gradient(145deg,#ffffff1f,#ffffff0a);border:1px solid #ffffff30;backdrop-filter:blur(8px);box-shadow:0 8px 0 #0004,0 14px 24px #0005;text-align:left;transition:transform .12s,box-shadow .12s}
.mode:active{transform:translateY(6px);box-shadow:0 2px 0 #0004}
.mode i{font-style:normal;font-size:34px;width:52px;height:52px;display:grid;place-items:center;border-radius:16px;background:var(--c)}
.mode b{display:block;font-size:21px;line-height:1.1}.mode small{opacity:.7;font-size:14px}
.tag{font-size:13px;padding:3px 12px;border-radius:99px;background:#06c28b33;color:#7dffd3;border:1px solid #06c28b66}
#inst{background:var(--gold);color:#2a1d00;padding:8px 20px;border-radius:99px;font-weight:700}
/* game */
#game{justify-content:space-between;padding-top:calc(env(safe-area-inset-top) + 8px)}
.top{width:min(560px,100%);display:flex;align-items:center;justify-content:space-between}
.ib{width:44px;height:44px;border-radius:14px;background:#ffffff1a;font-size:20px}
.chips{display:flex;gap:8px;flex:1;justify-content:center}
.chip{display:flex;align-items:center;gap:6px;padding:4px 10px 4px 5px;border-radius:99px;background:#ffffff14;border:2px solid transparent;transition:.25s;opacity:.65;font-size:14px;font-weight:700}
.chip em{font-style:normal;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--c);box-shadow:inset -2px -3px 4px #0004;font-size:12px}
.chip.on{opacity:1;border-color:var(--c);background:#ffffff26;box-shadow:0 0 18px var(--c);transform:scale(1.07)}
#stage{perspective:1100px;width:100%;display:grid;place-items:center;flex:1}
#board{position:relative;width:var(--s);height:var(--s);transform-style:preserve-3d;transform:rotateX(24deg);background:#fff6e2;border-radius:14px;border:7px solid #5b3a1f;box-shadow:0 1px 0 #7a5230,0 4px 0 #5b3a1f,0 8px 0 #4a2e18,0 12px 0 #3c2411,0 26px 34px #000a}
.c,.yd,#ctr{position:absolute}
.c{width:6.667%;height:6.667%;background:#fffaf0;border:1px solid #0000001f;display:grid;place-items:center;font-size:calc(var(--s)*.035);color:#0003}
.yd{width:40%;height:40%;background:var(--c);display:grid;place-items:center}
.yd div{width:66%;height:66%;background:#fff6e2;border-radius:18%;box-shadow:inset 0 3px 8px #0003;position:relative}
.sl{position:absolute;width:30%;height:30%;border-radius:50%;background:var(--c);opacity:.35;box-shadow:inset 0 3px 5px #0006}
#ctr{left:40%;top:40%;width:20%;height:20%;background:conic-gradient(from -45deg,var(--g) 0 25%,var(--y) 0 50%,var(--b) 0 75%,var(--r) 0 100%);box-shadow:inset 0 0 0 2px #fff8}
.tk{position:absolute;width:6.667%;height:6.667%;transform-style:preserve-3d;transition:left .17s linear,top .17s linear;cursor:pointer}
.pawn{position:absolute;left:10%;width:80%;bottom:22%;height:150%;transform-origin:50% 100%;transform:rotateX(-24deg);filter:drop-shadow(0 4px 2px #0007)}
.pawn::before{content:'';position:absolute;top:0;left:20%;width:60%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 33% 28%,#fffc,#fff0 38%),var(--c);box-shadow:inset -3px -4px 6px #0005;z-index:1}
.pawn::after{content:'';position:absolute;bottom:0;left:0;width:100%;height:72%;clip-path:polygon(38% 0,62% 0,100% 100%,0 100%);background:linear-gradient(90deg,#fff6,#fff0 40%,#0005),var(--c);border-radius:0 0 50% 50%/0 0 25% 25%}
.tk.can::after{content:'';position:absolute;inset:-6%;border-radius:50%;border:3px solid #fff;box-shadow:0 0 12px #fff,inset 0 0 8px #fff;animation:ring 1s infinite}
.tk.can .pawn{animation:jig .7s infinite}
.tk.hop .pawn{animation:hop .17s}
@keyframes ring{50%{transform:scale(1.25);opacity:.4}}
@keyframes jig{50%{transform:rotateX(-24deg) translateY(-18%)}}
@keyframes hop{50%{transform:rotateX(-24deg) translateY(-45%)}}
.low{width:min(560px,100%);display:flex;align-items:center;justify-content:center;gap:18px;padding-bottom:14px}
#dwrap{width:92px;height:92px;display:grid;place-items:center;border-radius:24px;background:#ffffff14;border:3px solid var(--c,#fff);box-shadow:0 0 22px var(--c,#fff6);perspective:400px;cursor:pointer}
#dwrap.pulse{animation:dp 1s infinite}
@keyframes dp{50%{transform:scale(1.08)}}
#dice{width:56px;height:56px;position:relative;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.2,.8,.25,1)}
.f{position:absolute;inset:0;background:linear-gradient(145deg,#fff,#dcdcdc);border-radius:10px;display:grid;grid:repeat(3,1fr)/repeat(3,1fr);padding:7px;backface-visibility:hidden;box-shadow:inset 0 0 6px #0003}
.f i{width:100%;height:100%;border-radius:50%;margin:auto;background:#111;transform:scale(.6)}
.f i.o{background:none}
#hint{font-size:18px;font-weight:700;max-width:200px;line-height:1.2}
#toast{position:fixed;left:50%;top:18%;transform:translate(-50%,-10px);background:#000c;padding:8px 18px;border-radius:99px;opacity:0;transition:.25s;pointer-events:none;z-index:9;font-weight:700}
#toast.s{opacity:1;transform:translate(-50%,0)}
#win{position:fixed;inset:0;background:#000b;display:grid;place-items:center;z-index:10;backdrop-filter:blur(6px)}
#win div.box{text-align:center;padding:30px 36px;border-radius:28px;background:linear-gradient(160deg,#3a2a7a,#15112e);border:2px solid var(--gold);box-shadow:0 0 50px #ffcb4766;animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.4);opacity:0}}
#win h2{margin:0;font-size:38px}#win p{margin:6px 0 18px;font-size:18px}
#win button{margin:4px;padding:10px 22px;border-radius:99px;background:var(--gold);color:#2a1d00;font-weight:800;font-size:17px}
#win button.g{background:#ffffff22;color:#fff}
.cf{position:fixed;top:-20px;width:10px;height:16px;z-index:11;animation:fall linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
</style>
</head>
<body>
<section id="menu">
  <h1>LUDO</h1>
  <p class="sub">Royale &middot; asli 3D Ludo</p>
  <div class="pawns" id="mp"></div>
  <button class="mode" style="--c:var(--r)" data-m="1v1"><i>🤖</i><span><b>Bot ke saath</b><small>Aap vs 1 Bot (1 v 1)</small></span></button>
  <button class="mode" style="--c:var(--b)" data-m="2p"><i>👫</i><span><b>2 Players</b><small>Dost ke saath, ek hi phone par</small></span></button>
  <button class="mode" style="--c:var(--g)" data-m="4p"><i>🎲</i><span><b>4 Players</b><small>Aap + 3 Bots</small></span></button>
  <span class="tag">Easy mode &middot; jeetna aasaan</span>
  <button id="inst" class="hide">📲 App install karein</button>
</section>

<section id="game" class="hide">
  <div class="top"><button class="ib" id="back" aria-label="Menu">←</button><div class="chips" id="chips"></div><button class="ib" id="snd" aria-label="Sound">🔊</button></div>
  <div id="stage"><div id="board"></div></div>
  <div class="low"><div id="dwrap"><div id="dice"></div></div><div id="hint"></div></div>
</section>
<div id="toast"></div>
<div id="win" class="hide"><div class="box"><h2 id="wt"></h2><p>Jeet mubarak ho! 🎉</p><button id="again">Dobara khelein</button><button class="g" id="home">Menu</button></div></div>

<script>
const $=s=>document.querySelector(s),sleep=ms=>new Promise(r=>setTimeout(r,ms));
const COL=['#ef476f','#06c28b','#ffc233','#3a86ff'],NAME=['Laal','Hara','Peela','Neela'];
const seg=(r,c,dr,dc,n)=>Array.from({length:n},(_,k)=>[r+dr*k,c+dc*k]);
const PATH=[...seg(6,1,0,1,5),...seg(5,6,-1,0,6),...seg(0,7,0,1,2),...seg(1,8,1,0,5),...seg(6,9,0,1,6),...seg(7,14,1,0,2),...seg(8,13,0,-1,5),...seg(9,8,1,0,6),...seg(14,7,0,-1,2),...seg(13,6,-1,0,5),...seg(8,5,0,-1,6),...seg(7,0,-1,0,2)];
const HOME=[seg(7,1,0,1,5),seg(1,7,1,0,5),seg(7,13,0,-1,5),seg(13,7,-1,0,5)];
const START=[0,13,26,39],SAFE=new Set([0,8,13,21,26,34,39,47]),ORG=[[0,0],[0,9],[9,9],[9,0]];
const PIPS={1:[4],2:[2,6],3:[2,4,6],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
const FACE={1:[0,0],2:[0,-90],3:[-90,0],4:[90,0],5:[0,90],6:[0,180]};
const TF=['','rotateY(90deg)','rotateX(90deg)','rotateX(-90deg)','rotateY(-90deg)','rotateY(180deg)'];
let P,toks,T,cur,sixes,busy,wait,mode,val=1,spin=0,muted=false,AC;
const pawnHTML=c=>`<div class="pawn" style="--c:${COL[c]}"></div>`;
$('#mp').innerHTML=[0,1,2,3].map(pawnHTML).join('');

/* sound */
function beep(f=520,d=.08,t='sine'){if(muted)return;try{AC=AC||new AudioContext();const o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.value=f;g.gain.setValueAtTime(.12,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(g).connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
$('#snd').onclick=()=>{muted=!muted;$('#snd').textContent=muted?'🔇':'🔊'};
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('s');clearTimeout(e.t);e.t=setTimeout(()=>e.classList.remove('s'),1300)}

/* board */
function buildBoard(){
  const B=$('#board');let h='';
  [0,1,2,3].forEach(c=>{const [r,cc]=ORG[c];h+=`<div class="yd" style="--c:${COL[c]};top:${r/15*100}%;left:${cc/15*100}%"><div>${[0,1,2,3].map(i=>`<span class="sl" style="--c:${COL[c]};top:${i>>1?58:12}%;left:${i&1?58:12}%"></span>`).join('')}</div></div>`});
  PATH.forEach(([r,c],i)=>{const s=START.indexOf(i);h+=`<div class="c" style="top:${r/15*100}%;left:${c/15*100}%;${s>=0?`background:${COL[s]};color:#fff8`:''}">${SAFE.has(i)?'★':''}</div>`});
  HOME.forEach((a,c)=>a.forEach(([r,cc])=>h+=`<div class="c" style="top:${r/15*100}%;left:${cc/15*100}%;background:${COL[c]}"></div>`));
  h+='<div id="ctr"></div>';B.innerHTML=h;
}
function pos(c,p,i){
  if(p<0)return[ORG[c][0]+1.5+(i>>1)*2,ORG[c][1]+1.5+(i&1)*2];
  if(p<=50)return PATH[(START[c]+p)%52];
  if(p<=55)return HOME[c][p-51];
  return[7,7];
}
function render(){
  const g={};
  P.forEach(({c})=>toks[c].forEach((p,i)=>{const [r,cc]=pos(c,p,i);(g[p<0?'y'+c+i:r+','+cc]=g[p<0?'y'+c+i:r+','+cc]||[]).push([c,i,r,cc])}));
  Object.values(g).forEach(a=>a.forEach(([c,i,r,cc],k)=>{const e=T[c][i],o=a.length>1?(k-(a.length-1)/2)*.28:0;e.style.left=(cc+o)/15*100+'%';e.style.top=r/15*100+'%';e.style.zIndex=Math.round(r*10)+k}));
}
/* dice */
function buildDice(){
  $('#dice').innerHTML=[1,2,3,4,5,6].map(n=>`<div class="f" style="transform:${TF[n-1]} translateZ(28px)">${Array.from({length:9},(_,k)=>`<i class="${PIPS[n].includes(k)?'':'o'}"></i>`).join('')}</div>`).join('');
  setDice(1,true);
}
function setDice(v,instant){
  const d=$('#dice');spin+=instant?0:2;const [x,y]=FACE[v];
  if(instant)d.style.transition='none';
  d.style.transform=`rotateX(${x+360*spin}deg) rotateY(${y+360*spin}deg) rotateZ(0deg)`;
  if(instant){d.offsetWidth;d.style.transition=''}
}
/* ui */
function ui(){
  $('#chips').innerHTML=P.map(({c,h},k)=>`<div class="chip ${k==cur?'on':''}" style="--c:${COL[c]}"><em>${toks[c].filter(p=>p==56).length}</em>${mode=='2p'?'P'+(k+1):h?'Aap':'Bot'}</div>`).join('');
  const c=P[cur].c;$('#dwrap').style.setProperty('--c',COL[c]);
  const h=P[cur].h;$('#hint').textContent=wait?'Goti chuniye 👆':h?(busy?'':'Dice par tap karein'):NAME[c]+' Bot soch raha hai…';
  $('#dwrap').classList.toggle('pulse',h&&!busy&&!wait);
}
/* game flow */
function start(m){
  mode=m;P=m=='4p'?[0,1,2,3].map(c=>({c,h:c==0})):[0,2].map(c=>({c,h:m=='2p'||c==0}));
  toks=[0,1,2,3].map(()=>[-1,-1,-1,-1]);cur=0;sixes=0;busy=0;wait=0;
  buildBoard();buildDice();T=[[],[],[],[]];
  P.forEach(({c})=>[0,1,2,3].forEach(i=>{const e=document.createElement('div');e.className='tk';e.innerHTML=pawnHTML(c);e.onclick=()=>pick(c,i);$('#board').appendChild(e);T[c][i]=e}));
  $('#menu').classList.add('hide');$('#game').classList.remove('hide');$('#win').classList.add('hide');
  render();turn();
}
function turn(){busy=0;wait=0;ui();if(!P[cur].h)setTimeout(roll,900)}
function dicePick(){
  const p=P[cur];let v=1+Math.random()*6|0;
  if(mode!='2p'){
    if(p.h){const t=toks[p.c];if(t.every(x=>x<0)&&Math.random()<.55)v=6;else if(Math.random()<.18)v=6}
    else if(v==6&&Math.random()<.5)v=1+Math.random()*5|0;
  }
  return v;
}
const legal=(c,v)=>toks[c].map((p,i)=>(p<0?v==6:p+v<=56)?i:-1).filter(i=>i>=0);
async function roll(){
  if(busy||wait)return;busy=1;ui();
  val=dicePick();setDice(val);beep(300,.12,'square');await sleep(850);beep(480,.08);
  const c=P[cur].c;
  if(val==6&&++sixes==3){toast('Teen 6! Baari gayi');await sleep(900);return next()}
  const m=legal(c,val);
  if(!m.length){toast('Koi chaal nahi');await sleep(800);return val==6?turn():next()}
  if(!P[cur].h){await sleep(450);return go(c,m[Math.random()*m.length|0])}
  if(m.length==1){await sleep(350);return go(c,m[0])}
  wait=1;busy=0;m.forEach(i=>T[c][i].classList.add('can'));ui();
}
function pick(c,i){if(wait&&P[cur].c==c&&T[c][i].classList.contains('can')){wait=0;go(c,i)}}
async function go(c,i){
  busy=1;wait=0;T[c].forEach(e=>e.classList.remove('can'));ui();
  const e=T[c][i];let cap=false;
  if(toks[c][i]<0){toks[c][i]=0;e.classList.add('hop');render();beep(660,.1);await sleep(260);e.classList.remove('hop')}
  else for(let s=0;s<val;s++){toks[c][i]++;e.classList.add('hop');render();beep(420+s*30,.06);await sleep(190);e.classList.remove('hop')}
  const p=toks[c][i];
  if(p<=50){const idx=(START[c]+p)%52;if(!SAFE.has(idx))P.forEach(({c:o})=>{if(o!=c)toks[o].forEach((q,j)=>{if(q>=0&&q<=50&&(START[o]+q)%52==idx){toks[o][j]=-1;cap=true}})})}
  render();
  if(cap){beep(160,.3,'sawtooth');toast('Goti kat gayi! ⚔️');await sleep(600)}
  if(p==56){beep(880,.25);toast('Goti ghar pahunchi! 🏠');await sleep(500)}
  ui();
  if(toks[c].every(x=>x==56))return win(k=>k);
  if(val==6||cap||p==56)return turn();
  next();
}
function next(){cur=(cur+1)%P.length;sixes=0;turn()}
function win(){
  const{c,h}=P[cur];$('#wt').textContent=mode=='2p'?'Player '+(cur+1)+' jeeta!':h?'Aap jeet gaye!':NAME[c]+' Bot jeeta';
  $('#win').classList.remove('hide');beep(784,.3);
  for(let i=0;i<70;i++){const d=document.createElement('i');d.className='cf';d.style.cssText=`left:${Math.random()*100}vw;background:${COL[i%4]};animation-duration:${2+Math.random()*2.5}s;animation-delay:${Math.random()}s`;document.body.appendChild(d);setTimeout(()=>d.remove(),5500)}
}
/* wiring */
document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>start(b.dataset.m));
$('#dwrap').onclick=()=>{if(P[cur].h&&!busy&&!wait)roll()};
$('#back').onclick=$('#home').onclick=()=>{busy=1;wait=1;$('#win').classList.add('hide');$('#game').classList.add('hide');$('#menu').classList.remove('hide')};
$('#again').onclick=()=>start(mode);
/* PWA */
let dip;addEventListener('beforeinstallprompt',e=>{e.preventDefault();dip=e;$('#inst').classList.remove('hide')});
$('#inst').onclick=async()=>{if(dip){dip.prompt();await dip.userChoice;dip=null;$('#inst').classList.add('hide')}};
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js'));
</script>
</body>
</html>
